services:
  mysql:
    image: mysql:8.0
    container_name: loan-tracker-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: loan_tracker
      MYSQL_USER: loan
      MYSQL_PASSWORD: loan
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - loan_tracker_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  loan_tracker_mysql_data:
